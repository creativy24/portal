# ============================================
# KONFIGURASI DETEKSI PORTAL TERPUSAT
# Edit file ini untuk mengubah keyword/signature/pattern deteksi
# ============================================

# ============================================
# Regex pattern untuk deteksi portal via konten HTML (HTTP 200 + form login)
# Case-insensitive, digunakan saat HTTP code 200 tapi tidak ada redirect
# ============================================
PORTAL_KEYWORDS='login|password|username|<form|captive|portal|autentikasi|masuk|sign-in|authentication|selamat datang|welcome|hotspot|auth|akun|akun anda|internet gratis|wms|wifi\.id'

# ============================================
# Signature unik untuk identifikasi tipe portal via konten HTML
# ============================================
HTML_SIGNATURE_HOTSPOT='$(link-login-only)'
HTML_SIGNATURE_WIFI_ID='wifi.id'
HTML_SIGNATURE_WMS='wms.wifi.id'
HTML_SIGNATURE_GENERIC='captive portal'
HTML_SIGNATURE_LOGIN_FORM='<form[^>]*login'
HTML_SIGNATURE_PASSWORD_FIELD='<input[^>]*password'
HTML_SIGNATURE_SESSION_ID='name=["\047]sessionid'

# ============================================
# Pattern matching untuk identifikasi tipe portal via URL
# Format: TYPE|PATTERN
# ============================================

# WMS Portal
URL_PATTERNS_WMS='/wms'

# WiFi.id Portal (multiple variants)
URL_PATTERNS_WIFI_ID='/loginjs|/loginocs|/login|wifi\.id'

# Hotspot MikroTik
URL_PATTERNS_HOTSPOT='/login.*dst=|login\.php\?mac=|mikrotik|hotspot'

# Generic Captive Portal
URL_PATTERNS_GENERIC='captive|portal|hotspot'

# ============================================
# Endpoint untuk probing jika endpoints.conf tidak ada
# ============================================
PROBE_ENDPOINT_PRIMARY='http://clients3.google.com/generate_204'
PROBE_ENDPOINT_FALLBACK='http://connectivity-check.ubuntu.com'